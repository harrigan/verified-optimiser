[package]
name = "crossing-counter-zk-steel"
version = "0.1.0"
edition = "2021"

[dependencies]
methods = { path = "../methods", package = "crossing-counter-zk-steel-methods" }
risc0-zkvm = { version = "^3.0.5" }
risc0-steel = { git = "https://github.com/boundless-xyz/steel", tag = "v2.4.3", features = ["host"] }
alloy = { version = "1.0", features = ["full", "node-bindings"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
url = "2"
